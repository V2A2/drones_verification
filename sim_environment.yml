# Conda env "sim" = merged "starv" (StarV verification tool) + "simd" (drone sim launcher).
#
# Create:   conda env create -f sim_environment.yml
#
# Prerequisites:
#   - git on PATH (StarV is cloned from GitHub, pinned to commit deb3953)
#   - system libs to build the glpk wheel:  sudo apt install libglpk-dev libgmp3-dev
#   - Gurobi license for gurobipy (see StarV/install_notes.txt)
#
# numpy/scipy are pinned to 1.26.4 / 1.13.0 because StarV requires numpy<=1.26.4, scipy<1.13.1.
name: sim
channels:
  - conda-forge
dependencies:
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2026.7.22
  - gmp=6.3.0
  - ld_impl_linux-64=2.46.1
